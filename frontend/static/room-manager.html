<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Manager · UniRoom</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/room-manager.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  </head>
  <body>
    <header class="rm-topbar">
      <a class="rm-brand" href="/">◈ UniRoom</a>
      <div class="d-flex align-items-center gap-3">
        <span id="rm-identity" class="rm-identity"></span>
        <a class="btn btn-sm btn-outline-light" href="/">Về trang chính</a>
        <button id="rm-logout" class="btn btn-sm btn-light">Đăng xuất</button>
      </div>
    </header>

    <main class="container-fluid rm-layout">
      <section class="rm-heading">
        <div>
          <span class="rm-eyebrow">UNIROOM · CẤP 1</span>
          <h1>Quản lý phòng</h1>
          <p>Phòng được hiển thị và thao tác theo phạm vi được phân công.</p>
        </div>
        <button id="rm-refresh" class="btn btn-primary">
          <i class="bi bi-arrow-clockwise me-1"></i>Làm mới
        </button>
      </section>

      <div id="rm-alert" class="rm-alert" role="status" aria-live="polite"></div>
      <nav class="rm-tabs" aria-label="Room Manager">
        <button data-tab="overview" class="active">Tổng quan</button>
        <button data-tab="approvals">Duyệt booking</button>
        <button data-tab="rooms">Phòng</button>
        <button data-tab="catalog">Tòa nhà & loại phòng</button>
        <button data-tab="equipment">Thiết bị</button>
        <button data-tab="calendar">Lịch phòng</button>
        <button data-tab="maintenance">Bảo trì / khóa</button>
        <button data-tab="reports">Báo cáo</button>
      </nav>
      <section id="rm-content" class="rm-content" aria-live="polite"></section>
    </main>

    <script src="/static/js/room-manager-level1.js"></script>
  </body>
</html>
