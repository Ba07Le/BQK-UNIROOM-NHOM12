<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142838" />
    <title>Quản lý phòng · UniRoom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23245c83%22/%3E%3Cpath d=%22M32 14l14 8v20l-14 8-14-8V22z%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%225%22/%3E%3C/svg%3E" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/static/css/room-manager.css" rel="stylesheet" />
    <link href="/static/css/room-manager-refinement.css?v=20261114" rel="stylesheet" />
    <link href="/static/css/uniroom-polish.css?v=20261116" rel="stylesheet" />
  </head>
  <body data-shell="manager">
    <script src="/static/js/uniroom-shell.js?v=20261116"></script>

    <main class="container-fluid rm-layout">
      <section class="rm-heading">
        <div>
          <span class="rm-eyebrow">UNIROOM · CẤP 1</span>
          <h1>Quản lý phòng</h1>
          <p>Phòng được hiển thị và thao tác theo phạm vi được phân công.</p>
        </div>
        <button id="rm-refresh" class="btn btn-primary">
          <i class="bi bi-arrow-clockwise me-1"></i>Làm mới
        </button>
      </section>

      <div id="rm-alert" class="rm-alert" role="status" aria-live="polite"></div>
      <nav class="rm-tabs" aria-label="Room Manager">
        <button data-tab="overview" class="active">Tổng quan</button>
        <button data-tab="approvals">Duyệt booking</button>
        <button data-tab="rooms">Phòng</button>
        <button data-tab="catalog">Tòa nhà & loại phòng</button>
        <button data-tab="equipment">Thiết bị</button>
        <button data-tab="calendar">Lịch phòng</button>
        <button data-tab="maintenance">Bảo trì / khóa</button>
        <button data-tab="reports">Báo cáo</button>
      </nav>
      <section id="rm-content" class="rm-content" aria-live="polite"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="/static/js/room-manager-level1.js?v=room-manager-separate-v4"></script>
    <script defer src="/static/js/uniroom-motion.js?v=20261116"></script>
  </body>
</html>
